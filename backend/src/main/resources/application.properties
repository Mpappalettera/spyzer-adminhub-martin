spring.application.name=crm-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/spyzer_crm
spring.datasource.username=postgres
spring.datasource.password=root32
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mail — variables de entorno con fallbacks para pruebas locales
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:tu-correo@escolapios.es}
spring.mail.password=${SMTP_PASS:tu-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=spyzer-crm-super-secret-key-for-hs256-algorithm-minimum-256bits
jwt.expiration-ms=86400000

# Sobreescribe propiedades con valores locales secretos (ignorado por Git)
spring.config.import=optional:file:.env.properties
